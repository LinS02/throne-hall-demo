<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>沉闕城・王座之廳</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  html, body { margin: 0; background: #16161e; color: #f0e6c8; font: 13px "Microsoft JhengHei", sans-serif; }
  #stage canvas { display: block; image-rendering: pixelated; }
  #hud { padding: 4px 8px; }
</style>
<!-- 前置：固定種子的亂數、虛擬時鐘。必須在任何遊戲程式之前跑（doc/sandbox.md「時間控制」） -->
<script>
if (!new URLSearchParams(location.search).get('scene')) location.replace('?scene=cq-throne&play=1' + location.hash);
</script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var s = (Number(q.get('seed')) || 1) >>> 0;
  Math.random = function () {
    s = (s + 0x6d2b79f5) | 0;
    var t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  // 每頁從乾淨的偏好開始（紙娃娃 v2、光影開關都存在 localStorage；不清的話上一個情境開的光影會漏到下一個）
  try { localStorage.clear(); } catch (e) {}

  var clock = { now: 1000 };
  window.__clock = clock;
  Date.now = function () { return clock.now; };
  performance.now = function () { return clock.now; };

  // 還在載的圖與 fetch（紙娃娃 v2 的動作圖是非同步載的）：runtime 等它歸零才開始 play
  var pending = 0;
  window.__pending = function () { return pending; };
  var origFetch = window.fetch;
  window.fetch = function () {
    pending++;
    return origFetch.apply(this, arguments).then(
      function (r) { return r.clone().arrayBuffer().then(function () { pending--; return r; }, function () { pending--; return r; }); },
      function (e) { pending--; throw e; }
    );
  };
  var src = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
  Object.defineProperty(HTMLImageElement.prototype, 'src', {
    configurable: true,
    get: src.get,
    set: function (v) {
      var img = this;
      pending++;
      var done = function () { pending--; img.removeEventListener('load', done); img.removeEventListener('error', done); };
      img.addEventListener('load', done);
      img.addEventListener('error', done);
      src.set.call(img, v);
    },
  });
})();
</script>
</head>
<body>
<div id="stage"></div>
<div id="hud"></div>
<script src="bundle.js"></script>
</body>
</html>
